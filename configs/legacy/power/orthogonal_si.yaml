memory:
  technology: si_dram
  backend: dreamram
  dreamram:
    memory_config: third_party/DreamRAM/configs/mem/baseline/hbm3_baseline.json
    technology_config: third_party/DreamRAM/configs/tech/scaled/16nm_scaled.json

architecture:
  name: orthogonal_si
  layers: 8
  geometry_source:
    config: configs/legacy/exp_orth_mosaic98_g414_m156p8_uniform.yaml
    memory_region: orthogonal_memory_slab
  vertical: {type: none, source: none}
  base_route: {enabled: false, source: none}
  interface:
    type: contactless
    source: constant
    energy_pj_per_bit: 0.5
  logic_background_w: null

workload:
  read_bandwidth_gbps: 39200
  write_bandwidth_gbps: 0
  row_policy: {activated_row_data_utilization: 1.0}

power:
  refresh: {enabled: false}
  background: {enabled: false}
