memory:
  technology: igzo_2t0c
  backend: dreamram
  dreamram:
    memory_config: third_party/DreamRAM/configs/mem/baseline/hbm3_baseline.json
    technology_config: third_party/DreamRAM/configs/tech/scaled/16nm_scaled.json
  cell_model:
    type: operation_table
    source: IEDM2026_HaotongZhu_V5
    geometry:
      # 0.023 um^2 is the paper-reported physical/raw bitcell footprint.
      # It is distinct from the 30 Mb/mm^2/layer architecture-level density.
      # Adapter mapping: physical X -> DreamRAM BL pitch, Y -> WL pitch.
      cell_area_um2: 0.023
      pitch_x_um: 0.15166
      pitch_y_um: 0.15166
      aspect_ratio: 1.0
      provenance:
        cell_area_um2: PAPER_REPORTED
        pitch_x_um: DERIVED_FROM_REFERENCE
        pitch_y_um: DERIVED_FROM_REFERENCE
        aspect_ratio: MODELING_CHOICE
    replacement:
      # Replace this audited 1T1C cell/BL/sensing block with one reported
      # MAT-local operation primitive; do not split it or add CSA/RBL terms.
      mapping_status: validated
      components: [bl-act, bl-pre]
      energy_source: operation_table
      component_energy_pj_per_bit: {}
    operations:
      read_0_pj_per_bit: 0.00060
      read_1_pj_per_bit: 0.36800
      write_00_pj_per_bit: 0.00030
      write_01_pj_per_bit: 0.00037
      write_10_pj_per_bit: 0.00058
      write_11_pj_per_bit: 0.00024
      refresh_0_pj_per_bit: 0.00090
      refresh_1_pj_per_bit: 0.37000
    operation_energy_provenance:
      source: IEDM2026_HaotongZhu_V5
      accounting_level: SPICE_EXTRACTED_MAT_LOCAL_OPERATION_ENERGY
      sensing_included: true
      distributed_rc_included: true
      accounting_note: >-
        Full-row SPICE includes distributed WWL/WBL/RWL/RBL RC. The current
        implementation keeps the audited bl-act/bl-pre replacement boundary;
        overlap with retained DreamRAM row/WL routing is not independently
        separable from the reported table.
    background:
      type: per_row
      value_w: 4.26e-15
    retention_s: null

architecture:
  name: orthogonal_m3d_igzo
  layers: 8
  geometry_source:
    config: configs/exp_orth_m3d8_g414_bw39p2_all1read.yaml
    memory_region: orthogonal_memory_slab
  vertical:
    type: miv
    source: constant
    energy_pj_per_bit: null
  base_route: {enabled: false, source: none}
  interface:
    type: contactless
    source: constant
    energy_pj_per_bit: 0.5
  logic_background_w: null

workload:
  read_bandwidth_gbps: 39200
  write_bandwidth_gbps: 0
  read_data: {p0: 0.5, p1: 0.5}
  row_policy: {rd_per_act: 64}

power:
  refresh: {enabled: false}
  background: {enabled: false}
