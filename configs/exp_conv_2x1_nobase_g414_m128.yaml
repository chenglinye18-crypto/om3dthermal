      repeat: 11
      layers: [[Hybrid_Bonding, 2 um], [DRAM_BEOL, 3 um], [Silicon, 41 um]]
    top: {layers: [[Hybrid_Bonding, 2 um], [DRAM_BEOL, 3 um], [Silicon, 169 um]]}
  thermal_silicon: {layers: [[Oxide, 1 um], [Thermal_Silicon, 774 um]]}
  top: {layers: [[TIM, 200 um], [Lid, 3000 um]]}
mesh: {dx: 0.5 mm, dy: 0.5 mm, dz_max: 100 um}
boundary: {ambient: 20 degC, lid_top_htc: 30000 W/m^2/K, laminate_bottom_htc: 200 W/m^2/K}
power:
  model: son23_dram_only
  gpu: 414 W
  hbm_each: 64 W
  son23_reference: {stack_total: 30 W, logic_phy: 4 W, logic_tsv: 2 W, dram_bank_per_die: 1.5 W, dram_tsv_per_die: 0.5 W, dram_die_count: 12}
solver: {method: pcg, rtol: 1e-6}
metadata:
  case_id: exp_conv_2x1_nobase_g414_m128
  scope: exp
  architecture: conventional_12hi_nobase
  power_model: son23_dram_only
  intervention: {removed_layers: [HBM_Base_BEOL_5um, HBM_Base_Si_50um], removed_logic_power_per_physical_stack: 8 W, retained_gpu_hbm_ubump: 40 um, top_cavity_fill: Mold}
  layout: {hbm_arrangement: 2x1_hbm, group_count: 2, physical_stack_equivalents_per_group: 2, group_footprint: [11 mm, 22 mm], merged_axis: y, internal_y_mold_seam: absent}
