# Conventional 2x1 with HBM base logic BEOL/Si removed.
name: exp_conv_2x1_nobase_g414_m128
materials:
  Lid: 400
  TIM: 9.71
  Silicon: 140
  Thermal_Silicon: 140
  DRAM_BEOL: 0.85
  HBM_Base_BEOL: 1.5
  BEOL_MXY: 1.5
  Oxide: 1.5
  FEOL: 7.9
  BSPDN: [83, 83, 71]
  Cu_Pillar_Bump: [0.54, 0.54, 13.25]
  GPU_HBM_uBump: [0.59, 0.59, 19.28]
  Hybrid_Bonding: 4.8
  Laminate: 13
  Mold: 3
geometry:
  package: {size: [65 mm, 65 mm]}
  gpu: {size: [30 mm, 22 mm]}
  memory_zone: {size: [30 mm, 22 mm]}
  thermal_silicon: {size: [8 mm, 22 mm]}
  hbm:
    size: [11 mm, 22 mm]
    dram_size: [10.8 mm, 21.8 mm]
    fill_above: Mold
    centers: {hbm_left: [-9.5 mm, 0 mm], hbm_right: [9.5 mm, 0 mm]}
stacks:
