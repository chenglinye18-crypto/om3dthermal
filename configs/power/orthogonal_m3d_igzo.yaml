memory:
  technology: igzo_2t0c
  backend: dreamram
  dreamram:
    memory_config: third_party/DreamRAM/configs/mem/baseline/hbm3_baseline.json
    technology_config: third_party/DreamRAM/configs/tech/scaled/16nm_scaled.json
  cell_model:
    type: operation_table
    source: IEDM2026_HaotongZhu_V5
    replacement:
      # Schema carrier for the indivisible Zhu primitive. The Tang-style M3D
      # path does not instantiate or replace any DreamRAM internal component.
      mapping_status: validated
      components: []
      energy_source: operation_table
      component_energy_pj_per_bit: {}
    operations:
      read_0_pj_per_bit: 0.00060
      read_1_pj_per_bit: 0.36800
      write_00_pj_per_bit: 0.00030
      write_01_pj_per_bit: 0.00037
      write_10_pj_per_bit: 0.00058
      write_11_pj_per_bit: 0.00024
      refresh_0_pj_per_bit: 0.00090
      refresh_1_pj_per_bit: 0.37000
    operation_energy_provenance:
      source: IEDM2026_HaotongZhu_V5
      accounting_level: SPICE_EXTRACTED_MAT_LOCAL_OPERATION_ENERGY
      sensing_included: true
      distributed_rc_included: true
      accounting_note: >-
        Full-row SPICE includes distributed WWL/WBL/RWL/RBL RC. The current
        Tang-style embedded-peripheral M3D path treats this as an indivisible
        local-operation primitive and excludes all DreamRAM HBM internal
        routing components.
    background:
      type: per_row
      value_w: 4.26e-15
    retention_s: null

architecture:
  name: orthogonal_m3d_igzo
  geometry_source:
    config: configs/orthogonal_m3d_edram_v0.yaml
    memory_region: orthogonal_m3d_slab
  m3d_subarray:
    type: tang_embedded_subarray
    subarray:
      n_rows: 512
      n_cols: 512
    subarray_cluster:
      subarrays_x: 8
      subarrays_y: 8
      grid: {nx: auto, ny: auto}
      provenance: MODELING_CHOICE
    spacing:
      subarray_gap_x_f: 2.0
      subarray_gap_y_f: 2.0
      cluster_gap_x_f: 2.0
      cluster_gap_y_f: 2.0
      provenance: MODELING_CHOICE
    global_peripheral:
      row_selection_band_f: 4.0
      column_write_selection_band_f: 2.0
      row_selection_band_axis: x
      column_write_selection_band_axis: y
      provenance: MODELING_CHOICE
    local_mux:
      # Independent from the shared 2F column/write-selection band.
      footprint_height_f: 4.0
      energy_pj_per_selected_bit: 0.010
      provenance: MODELING_CHOICE
    interconnect:
      # Temporary electrical values are first-order MODELING_CHOICE inputs.
      global_rwl:
        metal_width_nm: 100.0
        metal_thickness_nm: 100.0
        capacitance_fF_per_um: 0.30
        resistance_ohm_per_um: 0.10
        voltage_V: 1.0
        activity_factor: 0.5
        active_line_count: 1
        provenance: MODELING_CHOICE
      global_wwl:
        metal_width_nm: 100.0
        metal_thickness_nm: 100.0
        capacitance_fF_per_um: 0.30
        resistance_ohm_per_um: 0.10
        voltage_V: 1.0
        activity_factor: 0.0
        active_line_count: 1
        provenance: MODELING_CHOICE
      global_wbl:
        metal_width_nm: 100.0
        metal_thickness_nm: 100.0
        capacitance_fF_per_um: 0.30
        resistance_ohm_per_um: 0.10
        voltage_V: 1.0
        activity_factor: 0.0
        active_line_count: 1
        provenance: MODELING_CHOICE
      local_rbl:
        metal_width_nm: 100.0
        metal_thickness_nm: 100.0
        capacitance_fF_per_um: 0.30
        resistance_ohm_per_um: 0.10
        voltage_V: 1.0
        activity_factor: 0.5
        active_line_count: 1
        provenance: MODELING_CHOICE
    access:
      accessed_subarrays_per_access: 256
      accessed_clusters_per_access: 4
      selected_bits_per_subarray: 1
      provenance: MODELING_CHOICE
    topology_provenance: MODELING_CHOICE
  vertical:
    type: miv
    source: miv_topology
    # MODELING_CHOICE: DreamRAM TSV-derived distributed C/length with actual
    # M3D length. The local endpoint load is explicit and is not DreamRAM's
    # conventional-HBM receiver load.
    electrical_model: dreamram_length_scaled_reference
    fixed_load_pF: 0.006
    fixed_load_provenance: MODELING_CHOICE
  base_route: {enabled: false, source: none}
  interface:
    type: contactless
    source: constant
    energy_pj_per_bit: 0.5
  logic_background_w: null

workload:
  read_bandwidth_gbps: 39200
  write_bandwidth_gbps: 0
  read_data: {p0: 0.5, p1: 0.5}
  row_policy: {rd_per_act: 64}

power:
  refresh: {enabled: false}
  background: {enabled: false}
