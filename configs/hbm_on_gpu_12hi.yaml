# Paper-anchored 3D HBM-on-GPU benchmark, IEDM 2025 Fig. 3.
# All paper citations, source locations and modelling assumptions
# live in docs/benchmarks/hbm_on_gpu_12hi.md.
name: hbm_on_gpu_12hi

# Material conductivities in W/(m*K). Scalar = isotropic;
# 3-list = (kx, ky, kz) diagonal of the local conductivity tensor.
materials:
  Lid:                400
  TIM:                9.71
  Silicon:            140
  Thermal_Silicon:    140
  DRAM_BEOL:          0.85
  HBM_Base_BEOL:      1.5
  BEOL_MXY:           1.5
  Oxide:              1.5
  FEOL:               7.9
  BSPDN:              [83, 83, 71]
  Cu_Pillar_Bump:     [0.54, 0.54, 13.25]
  GPU_HBM_uBump:      [0.59, 0.59, 19.28]
  Hybrid_Bonding:     4.8
  Laminate:           13
  Mold:               3

# 2-D footprints (centred on origin unless `centers` overrides).
# `hbm` is parametric: the same 11x11 mm footprint is placed at each
# (x, y) in `centers`, and every DRAM layer uses `inset`.
geometry:
  package:         { size: [65 mm, 65 mm] }
  gpu:             { size: [30 mm, 22 mm] }
  memory_zone:     { size: [30 mm, 22 mm] }
  thermal_silicon: { size: [8 mm, 22 mm] }
  hbm:
    size:    [11 mm, 11 mm]
    inset:   0.5 mm
    centers:
      hbm_left_top:     [-9.5 mm,  5.5 mm]
      hbm_left_bottom:  [-9.5 mm, -5.5 mm]
      hbm_right_top:    [ 9.5 mm,  5.5 mm]
      hbm_right_bottom: [ 9.5 mm, -5.5 mm]

# Stack templates, bottom-to-top. Each entry is [material, thickness].
# The HBM stack is split into base, repeated DRAM block, top die.
stacks:
  foundation:    { layers: [[Laminate, 300 um]] }

  gpu:
    layers:
      - [Cu_Pillar_Bump, 70 um]
      - [BSPDN,          1.715 um]
      - [FEOL,           0.15 um]
      - [BEOL_MXY,       1.4 um]

  hbm:
    base:  { layers: [[GPU_HBM_uBump, 40 um], [HBM_Base_BEOL, 5 um], [Silicon, 50 um]] }
    dram:
      repeat: 11
      layers: [[Hybrid_Bonding, 2 um], [DRAM_BEOL, 3 um], [Silicon, 41 um]]
    top:   { layers: [[Hybrid_Bonding, 2 um], [DRAM_BEOL, 3 um], [Silicon, 169 um]] }

  thermal_silicon:
    layers: [[Oxide, 1 um], [Thermal_Silicon, 774 um]]

  top:    { layers: [[TIM, 200 um], [Lid, 3000 um]] }

# Discretisation.
mesh:
  dx:     0.5 mm
  dy:     0.5 mm
  dz_max: 100 um

# Convective boundary conditions (all other outer faces = adiabatic).
boundary:
  ambient:              20 degC
  lid_top_htc:          30000 W/m^2/K
  laminate_bottom_htc:  200 W/m^2/K

# Power sources: 414 W on the GPU FEOL layer, 40 W on the
# dram_beol layer of each of the four HBM columns.
power:
  gpu:      414 W
  hbm_each: 40 W

# Solver settings.
solver:
  method: pcg
  rtol:   1e-6
