# Runnable geometry example. Values marked NEEDS_PAPER_CONFIRMATION are placeholders
# because the source YAML/paper parameter table was not present in this workspace.
name: hbm_on_gpu_12hi
package_footprint: package

materials:
  Package_Substrate:
    name: Package_Substrate
    k_local: [20.0, 20.0, 2.0]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  Interposer:
    name: Interposer
    k_local: [130.0, 130.0, 130.0]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  GPU_Si:
    name: GPU_Si
    k_local: [130.0, 130.0, 130.0]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  Microbump:
    name: Microbump
    k_local: [30.0, 30.0, 30.0]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  DRAM_Si:
    name: DRAM_Si
    k_local: [130.0, 130.0, 130.0]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  Bonding:
    name: Bonding
    k_local: [0.5, 0.5, 0.5]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  Base_Die:
    name: Base_Die
    k_local: [130.0, 130.0, 130.0]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  Underfill:
    name: Underfill
    k_local: [0.8, 0.8, 0.8]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  TIM:
    name: TIM
    k_local: [5.0, 5.0, 5.0]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}
  Copper_Lid:
    name: Copper_Lid
    k_local: [400.0, 400.0, 400.0]
    metadata: {status: NEEDS_PAPER_CONFIRMATION}

footprints:
  package: {name: package, center_x: 0 mm, center_y: 0 mm, size_x: 65 mm, size_y: 65 mm}
  gpu: {name: gpu, center_x: 0 mm, center_y: 0 mm, size_x: 20 mm, size_y: 20 mm}
  memory_zone: {name: memory_zone, center_x: 0 mm, center_y: 0 mm, size_x: 48 mm, size_y: 44 mm}
  hbm_west: {name: hbm_west, center_x: -16 mm, center_y: 0 mm, size_x: 8 mm, size_y: 8 mm}
  hbm_east: {name: hbm_east, center_x: 16 mm, center_y: 0 mm, size_x: 8 mm, size_y: 8 mm}
  hbm_north: {name: hbm_north, center_x: 0 mm, center_y: 15 mm, size_x: 8 mm, size_y: 8 mm}
  hbm_south: {name: hbm_south, center_x: 0 mm, center_y: -15 mm, size_x: 8 mm, size_y: 8 mm}
  auxiliary_gap: {name: auxiliary_gap, center_x: 11 mm, center_y: 15 mm, size_x: 4 mm, size_y: 4 mm}
  short_column: {name: short_column, center_x: -11 mm, center_y: 15 mm, size_x: 4 mm, size_y: 4 mm}

stack_templates:
  foundation_stack:
    items:
      - {kind: layer, name: package_substrate, material: Package_Substrate, thickness: 1.2 mm}
      - {kind: layer, name: silicon_interposer, material: Interposer, thickness: 100 um}
  gpu_stack:
    items:
      - {kind: layer, name: gpu_microbump, material: Microbump, thickness: 100 um}
      - {kind: layer, name: gpu_silicon, material: GPU_Si, thickness: 700 um}
  hbm_12hi:
    items:
      - {kind: layer, name: base_die, material: Base_Die, thickness: 45 um}
      - kind: repeat
        count: 11
        layers:
          - {kind: layer, name: dram_si, material: DRAM_Si, thickness: 41 um, tags: {role: dram_si}}
          - {kind: layer, name: bonding, material: Bonding, thickness: 10 um}
      - {kind: layer, name: top_dram_si, material: DRAM_Si, thickness: 149 um, tags: {role: dram_si, top_die: true}}
  short_memory_stack:
    items:
      - {kind: layer, name: short_underfill, material: Underfill, thickness: 600 um}
  top_stack:
    items:
      - {kind: layer, name: thermal_interface, material: TIM, thickness: 50 um}
      - {kind: layer, name: lid, material: Copper_Lid, thickness: 1 mm}

horizontal:
  foundation: {footprint: package, stack: foundation_stack}
  gpu: {footprint: gpu, stack: gpu_stack}
  memory_zone:
    footprint: memory_zone
    reference_stack: hbm_12hi
    background_material: Underfill
    background_priority: 0
    columns:
      - {name: hbm_west, footprint: hbm_west, stack: hbm_12hi, priority: 10}
      - {name: hbm_east, footprint: hbm_east, stack: hbm_12hi, priority: 10}
      - {name: hbm_north, footprint: hbm_north, stack: hbm_12hi, priority: 10}
      - {name: hbm_south, footprint: hbm_south, stack: hbm_12hi, priority: 10}
      - name: matched_underfill
        footprint: auxiliary_gap
        material: Underfill
        match_height_of: hbm_12hi
        priority: 5
      - name: filled_short_column
        footprint: short_column
        stack: short_memory_stack
        fill_above: TIM
        priority: 5
  top: {footprint: package, stack: top_stack}

metadata:
  source_status: NEEDS_PAPER_CONFIRMATION
  note: Geometry dimensions and conductivities other than the required hbm_12hi layer thicknesses are placeholders.
