# Legacy uniform-power GPU-300 W derivative.
name: exp_conv_2x1_g300_m160_legacy_uniform

materials:
  Lid:                400
  TIM:                9.71
  Silicon:            140
  Thermal_Silicon:    140
  DRAM_BEOL:          0.85
  HBM_Base_BEOL:      1.5
  BEOL_MXY:           1.5
  Oxide:              1.5
  FEOL:               7.9
  BSPDN:              [83, 83, 71]
  Cu_Pillar_Bump:     [0.54, 0.54, 13.25]
  GPU_HBM_uBump:      [0.59, 0.59, 19.28]
  Hybrid_Bonding:     4.8
  Laminate:           13
  Mold:               3

geometry:
  package:         {size: [65 mm, 65 mm]}
  gpu:             {size: [30 mm, 22 mm]}
  memory_zone:     {size: [30 mm, 22 mm]}
  thermal_silicon: {size: [8 mm, 22 mm]}
  hbm:
    size:      [11 mm, 22 mm]
    dram_size: [10.8 mm, 21.8 mm]
    centers:
      hbm_left:  [-9.5 mm, 0 mm]
      hbm_right: [ 9.5 mm, 0 mm]

stacks:
  foundation: {layers: [[Laminate, 300 um]]}
  gpu:
    layers:
      - [Cu_Pillar_Bump, 70 um]
      - [BSPDN,          1.715 um]
      - [FEOL,           0.15 um]
      - [BEOL_MXY,       1.4 um]
  hbm:
    base: {layers: [[GPU_HBM_uBump, 40 um], [HBM_Base_BEOL, 5 um], [Silicon, 50 um]]}
    dram:
      repeat: 11
      layers: [[Hybrid_Bonding, 2 um], [DRAM_BEOL, 3 um], [Silicon, 41 um]]
    top: {layers: [[Hybrid_Bonding, 2 um], [DRAM_BEOL, 3 um], [Silicon, 169 um]]}
  thermal_silicon:
    layers: [[Oxide, 1 um], [Thermal_Silicon, 774 um]]
  top: {layers: [[TIM, 200 um], [Lid, 3000 um]]}

mesh:
  dx: 0.5 mm
  dy: 0.5 mm
  dz_max: 100 um

boundary:
  ambient: 20 degC
  lid_top_htc: 30000 W/m^2/K
  laminate_bottom_htc: 200 W/m^2/K

power:
  model: uniform
  gpu: 300 W
  hbm_each: 80 W

solver:
  alpha: 0.7
  rtol: 1e-6

metadata:
  case_id: exp_conv_2x1_g300_m160_legacy_uniform
  scope: exp
  architecture: conventional_12hi
  power_model: legacy_uniform
  layout:
    hbm_arrangement: 2x1_hbm
    group_count: 2
    group_footprint: [11 mm, 22 mm]
    merged_axis: y
    internal_y_mold_seam: absent
