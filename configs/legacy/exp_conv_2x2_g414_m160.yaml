# Canonical conventional 12Hi HBM using Son23 component-aware placement.
name: exp_conv_2x2_g414_m160

materials:
  Lid:                400
  TIM:                9.71
  Silicon:            140
  Thermal_Silicon:    140
  DRAM_BEOL:          0.85
  HBM_Base_BEOL:      1.5
  BEOL_MXY:           1.5
  Oxide:              1.5
  FEOL:               7.9
  BSPDN:              [83, 83, 71]
  Cu_Pillar_Bump:     [0.54, 0.54, 13.25]
  GPU_HBM_uBump:      [0.59, 0.59, 19.28]
  Hybrid_Bonding:     4.8
  Laminate:           13
  Mold:               3

geometry:
  package:         { size: [65 mm, 65 mm] }
  gpu:             { size: [30 mm, 22 mm] }
  memory_zone:     { size: [30 mm, 22 mm] }
  thermal_silicon: { size: [8 mm, 22 mm] }
  hbm:
    size:      [11 mm, 11 mm]
    dram_size: [10.8 mm, 10.8 mm]
    centers:
      hbm_left_top:     [-9.5 mm,  5.5 mm]
      hbm_left_bottom:  [-9.5 mm, -5.5 mm]
      hbm_right_top:    [ 9.5 mm,  5.5 mm]
      hbm_right_bottom: [ 9.5 mm, -5.5 mm]

stacks:
  foundation: { layers: [[Laminate, 300 um]] }
  gpu:
    layers:
      - [Cu_Pillar_Bump, 70 um]
      - [BSPDN,          1.715 um]
      - [FEOL,           0.15 um]
      - [BEOL_MXY,       1.4 um]
  hbm:
    base: { layers: [[GPU_HBM_uBump, 40 um], [HBM_Base_BEOL, 5 um], [Silicon, 50 um]] }
    dram:
      repeat: 11
      layers: [[Hybrid_Bonding, 2 um], [DRAM_BEOL, 3 um], [Silicon, 41 um]]
    top: { layers: [[Hybrid_Bonding, 2 um], [DRAM_BEOL, 3 um], [Silicon, 169 um]] }
  thermal_silicon:
    layers: [[Oxide, 1 um], [Thermal_Silicon, 774 um]]
  top: { layers: [[TIM, 200 um], [Lid, 3000 um]] }

mesh:
  dx:     0.5 mm
  dy:     0.5 mm
  dz_max: 100 um

boundary:
  ambient:              20 degC
  lid_top_htc:          30000 W/m^2/K
  laminate_bottom_htc:  200 W/m^2/K

power:
  model: son23split
  gpu: 414 W
  hbm_each: 40 W
  son23_reference:
    stack_total:       30 W
    logic_phy:          4 W
    logic_tsv:          2 W
    dram_bank_per_die:  1.5 W
    dram_tsv_per_die:   0.5 W
    dram_die_count:    12

solver:
  alpha: 0.7
  rtol: 1e-6

metadata:
  case_id: exp_conv_2x2_g414_m160
  scope: exp
  architecture: conventional_12hi
  power_model: son23_component_aware_default
  layout:
    hbm_arrangement: 2x2_hbm
    cube_count: 4
    cube_footprint: [11 mm, 11 mm]
  provenance:
    son23_30W_component_partition: PAPER_REPORTED
    40W_proportional_scaling: DERIVED_FROM_REFERENCE
    functional_heat_to_existing_BEOL: MODELING_CHOICE
    lateral_phy_tsv_bank_floorplan: UNRESOLVED_DO_NOT_GUESS
